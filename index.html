<script>
const D = JSON.parse(document.getElementById('data').textContent);
const LINES = Object.fromEntries(D.lines.map(l => [l.id, l]));
const ST_COLOR = {normal:null, reports:[255,176,32], disrupted:[255,59,78]};
const hex = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const statusOf = id => D.status[id] || 'unknown';

const KX = 111320 * Math.cos(3.1 * Math.PI / 180), KY = 110540; // metres per degree at KL
// pattern pre-processing: 3D path at the line's height, total duration
for (const p of D.patterns) {
  const z = LINES[p.line].z;
  p.path3 = p.path.map(c => [c[0], c[1], z]);
  p.total = p.times[p.times.length-1];
  p.rgb = hex(LINES[p.line].color);
  p.lite = p.rgb.map(v => Math.round(v + (255 - v) * 0.45));
  p.cum = [0]; // metres along path, for placing carriages
  for (let i = 1; i < p.path.length; i++) {
    const dx = (p.path[i][0] - p.path[i-1][0]) * KX, dy = (p.path[i][1] - p.path[i-1][1]) * KY;
    p.cum.push(p.cum[i-1] + Math.hypot(dx, dy));
  }
}

// ── HUD ──
const order = ['KJ','AG','PH','SA','KGL','PYL','MR','KC05_KB18','KA15_KD19'];
document.getElementById('lines').innerHTML = order.filter(id => LINES[id]).map(id => {
  const l = LINES[id], s = statusOf(id);
  return `<div class="row"><span class="sw" style="background:${l.color};color:${l.color}"></span>
    <span class="nm">${l.name}</span><span class="st ${s}">${s}</span></div>`;
}).join('');
document.getElementById('note').textContent =
  `Train positions simulated from GTFS timetable (api.data.gov.my), not live GPS · ` +
  `status ${D.statusTime || 'n/a'} from lrt_status.py` +
  (D.statusAgeMin > 90 ? ` (STALE — ${Math.round(D.statusAgeMin/60)}h old)` : '') + ` · built ${D.generated}`;

// ── time (Malaysia, UTC+8, regardless of viewer TZ) ──
const mytSec = () => { const d = new Date(Date.now() + 8*3600e3);
  return d.getUTCHours()*3600 + d.getUTCMinutes()*60 + d.getUTCSeconds() + d.getUTCMilliseconds()/1000; };
let simT = mytSec(), speed = 1, lastFrame = performance.now();
const fmt = s => { s = ((s % 86400) + 86400) % 86400;
  return [s/3600|0, (s/60|0)%60, s%60|0].map(v => String(v).padStart(2,'0')).join(':'); };

// ── simulation ──
const TRAIL = 150; // seconds of trail
function locate(p, e) { // e = seconds since origin departure
  const t = p.times; let lo = 0, hi = t.length - 1;
  if (e <= t[0]) return p.path3[0];
  if (e >= t[hi]) return p.path3[hi];
  while (hi - lo > 1) { const m = (lo+hi) >> 1; (t[m] <= e ? lo = m : hi = m); }
  const span = t[hi] - t[lo], f = span > 0 ? (e - t[lo]) / span : 0;
  const a = p.path3[lo], b = p.path3[hi];
  return [a[0] + f*(b[0]-a[0]), a[1] + f*(b[1]-a[1]), a[2]];
}
function nextStop(p, e) {
  for (let i = 0; i < p.stopTimes.length; i++) if (p.stopTimes[i] >= e) return p.stopNames[i];
  return p.stopNames[p.stopNames.length-1];
}
function distAt(p, e) { // metres travelled along path at e seconds after departure
  const t = p.times, c = p.cum; let lo = 0, hi = t.length - 1;
  if (e <= t[0]) return 0;
  if (e >= t[hi]) return c[hi];
  while (hi - lo > 1) { const m = (lo+hi) >> 1; (t[m] <= e ? lo = m : hi = m); }
  const span = t[hi] - t[lo], f = span > 0 ? (e - t[lo]) / span : 0;
  return c[lo] + f * (c[hi] - c[lo]);
}
function poseAt(p, d) { // [lon, lat, yaw°] at distance d; extrapolates past either end
  const c = p.cum, P = p.path, n = c.length;
  let lo, hi;
  if (d <= 0) { hi = 1; while (hi < n - 1 && c[hi] === 0) hi++; lo = hi - 1; }
  else if (d >= c[n-1]) { lo = n - 2; while (lo > 0 && c[lo] === c[n-1]) lo--; hi = lo + 1; }
  else { lo = 0; hi = n - 1; while (hi - lo > 1) { const m = (lo+hi) >> 1; (c[m] <= d ? lo = m : hi = m); } }
  const a = P[lo], b = P[hi], len = c[hi] - c[lo] || 1, f = (d - c[lo]) / len;
  return [a[0] + f*(b[0]-a[0]), a[1] + f*(b[1]-a[1]),
          Math.atan2((b[1]-a[1]) * KY, (b[0]-a[0]) * KX) * 180 / Math.PI];
}

// ── train models: built from boxes, front = +x, metres ──
const TRAINS = {KJ:{t:'lrt',cars:4}, SA:{t:'lrt',cars:3}, AG:{t:'lrt',cars:4}, PH:{t:'lrt',cars:4},
  KGL:{t:'mrt',cars:4}, PYL:{t:'mrt',cars:4}, MR:{t:'mono',cars:4}};
const trainOf = line => TRAINS[line] || {t:'ktm', cars:6};
function meshBuilder() {
  const P = [], N = [], C = [];
  const quad = (a, b, c, d, n, col) => { for (const v of [a, b, c, a, c, d]) { P.push(...v); N.push(...n); C.push(...col); } };
  const box = (x0, x1, y0, y1, z0, z1, col) => {
    quad([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],[0,0,1],col);
    quad([x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[x1,y0,z0],[0,0,-1],col);
    quad([x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],[0,-1,0],col);
    quad([x1,y1,z0],[x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[0,1,0],col);
    quad([x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1],[1,0,0],col);
    quad([x0,y1,z0],[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[-1,0,0],col);
  };
  const done = () => ({positions:{value:new Float32Array(P), size:3},
    normals:{value:new Float32Array(N), size:3}, colors:{value:new Float32Array(C), size:3}});
  return {box, done};
}
const GLASS = [0.10, 0.13, 0.18], DARK = [0.18, 0.19, 0.21];
function buildModel({L, W, H, gap, body, z0 = 0.5, winH = [0.5, 0.8], winW = 1.4, winStep = 2.2,
                     stripes = [[0.30, 0.40]], roof = null, extra = null}) {
  const b = meshBuilder(), lv = meshBuilder(), hw = W / 2, x0 = -L / 2, x1 = L / 2;
  b.box(x0, x1, -hw, hw, z0, H, body);                                   // body shell
  for (let x = x0 + 1.2; x + winW < x1 - 1.0; x += winStep)             // side windows
    b.box(x, x + winW, -hw - 0.04, hw + 0.04, H * winH[0], H * winH[1], GLASS);
  b.box(x1 - 0.1, x1 + 0.06, -hw + 0.35, hw - 0.35, H * 0.48, H * 0.84, GLASS); // end windows
  b.box(x0 - 0.06, x0 + 0.1, -hw + 0.35, hw - 0.35, H * 0.48, H * 0.84, GLASS);
  if (roof) roof(b, {L, W, H, x0, x1, hw});
  if (extra) extra(b, {L, W, H, x0, x1, hw, z0});
  for (const [s0, s1] of stripes) lv.box(x0, x1, -hw - 0.06, hw + 0.06, H * s0, H * s1, [1, 1, 1]);
  return {L, gap, body: b.done(), livery: lv.done()};
}
const MODELS = {
  // LRT (Innovia / CRRC style): mid-size white car, roof aircon pod
  lrt: buildModel({L:17, W:2.65, H:3.45, gap:0.8, body:[0.93,0.94,0.96],
    roof:(b, m) => b.box(-m.L*0.3, m.L*0.3, -0.8, 0.8, m.H, m.H + 0.3, [0.78,0.8,0.83])}),
  // MRT: longer, wider, brushed silver, dark under-skirt, broad window band
  mrt: buildModel({L:22, W:3.2, H:3.95, gap:0.9, body:[0.80,0.82,0.86], winH:[0.48,0.82], winW:1.8, winStep:2.6,
    stripes:[[0.27,0.36]],
    extra:(b, m) => b.box(m.x0 + 0.3, m.x1 - 0.3, -m.hw + 0.15, m.hw - 0.15, 0, m.z0, DARK),
    roof:(b, m) => { b.box(-m.L*0.38, -m.L*0.12, -0.9, 0.9, m.H, m.H + 0.35, [0.7,0.72,0.75]);

  // KTM Komuter EMU: long white car, double livery stripe, pantograph + bogies
  ktm: buildModel({L:22, W:2.9, H:3.95, gap:1.0, body:[0.95,0.95,0.94], z0:0.9,
    stripes:[[0.30,0.36],[0.40,0.44]],
    roof:(b, m) => { b.box(-1.6, 1.6, -0.9, 0.9, m.H, m.H + 0.25, DARK);                 // pantograph base
                     b.box(-0.1, 0.1, -0.9, 0.9, m.H + 0.25, m.H + 1.1, [0.35,0.36,0.38]); // pantograph arm
                     b.box(-0.7, 0.7, -0.9, 0.9, m.H + 1.05, m.H + 1.15, [0.35,0.36,0.38]); },
    extra:(b, m) => { b.box(m.x0 + 2, m.x0 + 5, -1.1, 1.1, 0, m.z0, DARK);                 // bogies
                      b.box(m.x1 - 5, m.x1 - 2, -1.1, 1.1, 0, m.z0, DARK); }}),
  // KL Monorail: short rounded cars straddling the beam
  mono: buildModel({L:12, W:2.7, H:3.4, gap:0.7, body:[0.92,0.95,0.90], z0:0.3, winH:[0.52,0.8], winStep:2.0,
    stripes:[[0.12,0.34]],
    roof:(b, m) => b.box(m.x0 + 0.6, m.x1 - 0.6, -m.hw + 0.35, m.hw - 0.35, m.H, m.H + 0.35, [0.85,0.88,0.84]),
    extra:(b, m) => b.box(m.x0 + 0.4, m.x1 - 0.4, -0.75, 0.75, -1.4, m.z0, DARK)}),       // beam-straddling skirt
};

let runsKey = '', runs = [];
function activeRuns(T) {
  const out = [];
  for (const p of D.patterns) for (const s0 of p.starts) {
    for (const s of [s0, s0 - 86400]) { // runs after midnight carry times >24h
      const e = T - s;
      if (e >= 0 && e <= p.total + TRAIL) out.push({p, s});
    }
  }
  return out;
}

// ── map ──
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center: [101.665, 3.115], zoom: 11.2, pitch: 58, bearing: -18, maxPitch: 80, antialias: true, hash: true,
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}), 'top-right');
map.on('load', () => {
  try {
    const src = Object.keys(map.getStyle().sources).find(k => /carto/i.test(k));
    if (src) map.addLayer({id:'bld3d', type:'fill-extrusion', source:src, 'source-layer':'building', minzoom:12.5,
      paint:{'fill-extrusion-color':'#1a2133','fill-extrusion-opacity':0.85,
        'fill-extrusion-height':['coalesce',['get','render_height'],12],
        'fill-extrusion-base':['coalesce',['get','render_min_height'],0]}});
  } catch (e) { console.warn('buildings', e); }
});

const overlay = new deck.MapboxOverlay({interleaved: true, layers: []});
map.addControl(overlay);

const stationColor = st => {
  const bad = st.lines.map(statusOf).find(s => s === 'disrupted') || st.lines.map(statusOf).find(s => s === 'reports');
  if (bad) return ST_COLOR[bad];
  return st.lines.length > 1 ? [235,240,255] : hex(LINES[st.lines[0]].color);
};
// one track per distinct route: KTM has dozens of patterns over the same
// stretch, and opposite directions overlap -> dedupe by line + endpoints
const seen = new Set(), tracks = [];
for (const p of D.patterns) {
  const ends = [p.path[0], p.path[p.path.length-1]].map(c => c.map(v => v.toFixed(3)).join(',')).sort().join('|');
  const k = p.line + ':' + ends;
  if (!seen.has(k)) { seen.add(k); tracks.push(p); } }

let showTrails = true, showBld = true, orbit = false;
// follow cam: click a train (or ?follow=KGL) to ride along; drag the map to stop
let follow = null, followLine = new URLSearchParams(location.search).get('follow');

function layers(T, pulse) {
  const key = Math.floor(T / 5);
  if (key + ':' + speed !== runsKey) { runsKey = key + ':' + speed; runs = activeRuns(T); }
  const live = runs.filter(r => T - r.s <= r.p.total);
  document.getElementById('count').textContent = live.length;
  const PZ = Math.min(1, Math.max(0.25, Math.pow(2, 13.5 - map.getZoom()))); // pillar scale
  const L = [
    new deck.PathLayer({id:'track-glow', data:tracks, parameters:{depthWriteEnabled:false},  getPath:d => d.path3,
      getColor:d => [...d.rgb, 50], getWidth:14, widthUnits:'pixels', widthMinPixels:6, capRounded:true, jointRounded:true}),
    new deck.PathLayer({id:'track-alert', parameters:{depthWriteEnabled:false},  data:tracks.filter(d => ST_COLOR[statusOf(d.line)]),
      getPath:d => d.path3, getColor:d => [...ST_COLOR[statusOf(d.line)], 90 + 140*pulse],
      getWidth:9, widthUnits:'pixels', capRounded:true, jointRounded:true,
      updateTriggers:{getColor:pulse}}),
    new deck.PathLayer({id:'track', data:tracks, parameters:{depthWriteEnabled:false},  getPath:d => d.path3,
      getColor:d => [...d.rgb, 230], getWidth:2.5, widthUnits:'pixels', capRounded:true, jointRounded:true, pickable:true}),
    new deck.ColumnLayer({id:'stations', data:D.stations, diskResolution:12, radius:38 * PZ, extruded:true, pickable:true,
      getPosition:d => [d.lon, d.lat], getElevation:d => PZ * (d.lines.length > 1 ? 420 : 200) *
        (d.lines.some(l => statusOf(l) === 'disrupted') ? 1 + 0.4*pulse : 1),
      getFillColor:d => [...stationColor(d), 150], material:false,
      updateTriggers:{getElevation:[pulse, PZ]}}),
  ];
  if (showTrails) L.push(new deck.TripsLayer({id:'trails', data:runs, parameters:{depthWriteEnabled:false}, 
    getPath:r => r.p.path3, getTimestamps:r => r.p.times.map(t => t + r.s),
    getColor:r => r.p.lite, widthMinPixels:4, getWidth:6, trailLength:TRAIL, currentTime:T,
    fadeTrail:true, capRounded:true, jointRounded:true, updateTriggers:{getTimestamps:runsKey}}));
  // carriages: exaggerated when zoomed out so trains stay readable, true size up close
  const zoom = map.getZoom(), S = Math.min(12, Math.max(2, Math.pow(2, 16.6 - zoom)));
  const X = Math.min(3, Math.max(1, Math.pow(2, 17 - zoom) / S)); // extra width/height boost
  const haloA = Math.round(90 * Math.min(1, Math.max(0, (13.5 - zoom) / 2)));
  const cars = {lrt:[], mrt:[], ktm:[], mono:[]}, heads = [];
  for (const r of live) {
    const e = T - r.s, d = distAt(r.p, e), cfg = trainOf(r.p.line), M = MODELS[cfg.t], z = LINES[r.p.line].z;
    heads.push({pos: locate(r.p, e), r});
    if (!follow && followLine && r.p.line === followLine && e > 120) { follow = r; followLine = null; }
    if (follow === r) map.jumpTo({center: poseAt(r.p, d - S * cfg.cars * (M.L + M.gap) / 2).slice(0, 2)});
    for (let k = 0; k < cfg.cars; k++) {
      const pose = poseAt(r.p, d - S * (k * (M.L + M.gap) + M.L / 2));
      cars[cfg.t].push({pos: [pose[0], pose[1], z], yaw: pose[2], rgb: r.p.rgb, r, e});
    }
  }
  if (haloA > 0) L.push(new deck.ScatterplotLayer({id:'orb-halo', data:heads, getPosition:d => d.pos,
    getFillColor:d => [...d.r.p.lite, haloA], getRadius:140, radiusMinPixels:8, radiusMaxPixels:18,
    billboard:true, parameters:{depthWriteEnabled:false}}));
  for (const t of Object.keys(cars)) {
    if (!cars[t].length) continue;
    const common = {data:cars[t], getPosition:d => d.pos, getOrientation:d => [0, d.yaw, 0],
      getScale:[1, X, X], sizeScale:S, material:{ambient:0.55, diffuse:0.6, shininess:40, specularColor:[70,75,85]}};
    L.push(new deck.SimpleMeshLayer({...common, id:'train-' + t, mesh:MODELS[t].body,
      getColor:[255,255,255], pickable:true}));
    L.push(new deck.SimpleMeshLayer({...common, id:'livery-' + t, mesh:MODELS[t].livery,
      getColor:d => d.rgb}));
  }
  return L;
}

// tooltip
const tip = document.getElementById('tip');
overlay.setProps({onHover: info => {
  const o = info.object;
  if (!o) { tip.style.display = 'none'; return; }
  if (info.layer.id.startsWith('train-')) tip.dataset.hint = 'click to follow';
  let h = '';
  if (info.layer.id === 'stations')
    h = `<b>${o.name}</b><br>` + o.lines.map(l => `${LINES[l].name} — ${statusOf(l)}`).join('<br>');
  else if (info.layer.id.startsWith('train-'))
    h = `<b>${LINES[o.r.p.line].name}</b><br>${o.r.p.headsign}<br>next: ${nextStop(o.r.p, o.e)}<br><span class="sub">${follow === o.r ? 'following — drag map to stop' : 'click to follow'}</span>`;
  else if (info.layer.id === 'track')
    h = `<b>${LINES[o.line].name}</b><br>status: ${statusOf(o.line)}`;
  tip.innerHTML = h; tip.style.display = 'block';
  tip.style.left = Math.min(info.x + 14, innerWidth - 250) + 'px'; tip.style.top = (info.y + 14) + 'px';
}});

// controls
overlay.setProps({onClick: info => {
  if (info.object && info.layer.id.startsWith('train-')) {
    follow = info.object.r;
    if (map.getZoom() < 15) map.easeTo({zoom: 17.3, pitch: 65, duration: 800});
  }
}});
map.on('dragstart', () => { follow = null; });
document.querySelectorAll('#speed button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#speed button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); speed = +b.dataset.s;
  if (speed === 1) simT = mytSec();
  document.getElementById('mode').textContent = speed === 1 ? 'live time' : `timetable replay ${speed}×`;
});
const tog = (id, fn) => { const b = document.getElementById(id); b.onclick = () => { b.classList.toggle('on'); fn(b.classList.contains('on')); }; };
tog('orbit', v => orbit = v);
tog('trails', v => showTrails = v);
tog('bld', v => { showBld = v; if (map.getLayer('bld3d')) map.setLayoutProperty('bld3d', 'visibility', v ? 'visible' : 'none'); });

function frame(now) {
  const dt = (now - lastFrame) / 1000; lastFrame = now;
  simT = speed === 1 ? mytSec() : (simT + dt * speed) % 86400;
  document.getElementById('clock').textContent = fmt(simT);
  if (orbit) map.setBearing(map.getBearing() + dt * 4);
  const pulse = 0.5 + 0.5 * Math.sin(now / 350);
  overlay.setProps({layers: layers(simT, pulse)});
  requestAnimationFrame(frame);
}
// ?speed=120 opens straight into timetable replay
const qs = +new URLSearchParams(location.search).get('speed');
const qb = document.querySelector(`#speed button[data-s="${qs}"]`);
if (qb) qb.click();
requestAnimationFrame(frame);
</script></body></html>
